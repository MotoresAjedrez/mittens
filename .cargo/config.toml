# OJO: nada de target-cpu especifico va en [build] global. Ese bloque aplica
# por default a CUALQUIER build sin seccion [target.*] propia, incluyendo el
# de quien clone este repo en Linux, Windows, Mac Intel u otro chip Apple.
# "target-cpu=apple-m5" ahi rompia el build de todo el mundo que no fuera
# exactamente esta Mac (LLVM viejo no reconoce "apple-m5" -> falla al
# compilar). La optimizacion especifica del M5 va SOLO en la seccion
# [target.aarch64-apple-darwin] de abajo, que solo aplica cuando se compila
# para Mac Apple Silicon.
# Perfiles de Apple Silicon:
# - Local en esta Mac (por defecto): `target-cpu=apple-m5` (activa FEAT_I8MM / USDOT inline).
# - Distribuible M2+ (Mac M2/M3/M4/M5 e iPads M2/M4 con FEAT_I8MM):
#     RUSTFLAGS="-C target-cpu=apple-m2" cargo build --release
# - Distribuible universal Apple Silicon (incluye Mac/iPad M1 sin SIGILL):
#     RUSTFLAGS="-C target-cpu=apple-m1" cargo build --release
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m5", "-C", "target-feature=+dotprod"]

[target.aarch64-linux-android]
linker = "/opt/homebrew/Caskroom/android-ndk/29/AndroidNDK14206865.app/Contents/NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin/aarch64-linux-android24-clang"
ar = "/opt/homebrew/Caskroom/android-ndk/29/AndroidNDK14206865.app/Contents/NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ar"
# +dotprod aqui NO es opcional: src/neural.rs (cfg(target_arch = "aarch64"))
# usa "sdot" en ensamblador en linea sin fallback escalar, asi que CUALQUIER
# build aarch64 (Android, Linux, macOS) directamente no compila sin esta
# bandera -- no es una optimizacion "a lo mejor la CPU la tiene", es un
# requisito duro del codigo fuente. dotprod es ARMv8.2+ (~2017 en adelante),
# lo trae practicamente cualquier telefono o servidor ARM64 moderno
# (confirmado FEAT_DotProd=1 en los 2 celulares de prueba).
# Para celulares ARMv8.6+ con FEAT_I8MM (ej. Snapdragon 8 Gen 1..Elite Gen 5):
#     RUSTFLAGS="-C target-feature=+dotprod,+i8mm" cargo build --release --target aarch64-linux-android
rustflags = ["-C", "target-feature=+dotprod"]

# --- Android 32 bits (celulares viejos/economicos) ---
[target.armv7-linux-androideabi]
linker = "/opt/homebrew/Caskroom/android-ndk/29/AndroidNDK14206865.app/Contents/NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin/armv7a-linux-androideabi24-clang"
ar = "/opt/homebrew/Caskroom/android-ndk/29/AndroidNDK14206865.app/Contents/NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ar"
rustflags = []

# --- Emulador x86_64 (imagenes "Google APIs x86_64") ---
[target.x86_64-linux-android]
linker = "/opt/homebrew/Caskroom/android-ndk/29/AndroidNDK14206865.app/Contents/NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin/x86_64-linux-android24-clang"
ar = "/opt/homebrew/Caskroom/android-ndk/29/AndroidNDK14206865.app/Contents/NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ar"
rustflags = []

# --- Binario universal x86_64 (Windows / Linux / macOS Intel / Rosetta 2) ---
# x86-64-v2 (SSE4.2+POPCNT) es la linea base segura de compilacion: corre en
# cualquier CPU x86_64 desde ~2009 sin riesgo de SIGILL, pero el binario
# detecta en tiempo de ejecucion (`is_x86_feature_detected!`):
#   - AVX2 (256 bits) vs SSE2 (128 bits) en `src/bullet_net.rs` (tanto en
#     actualizacion incremental del acumulador como en salida SCReLU).
#   - BMI2 `PEXT` vs Magic Bitboards en `src/bitboard.rs`, excluyendo
#     automaticamente AMD pre-Zen 3 (`AuthenticAMD` con `display_family < 0x19`,
#     donde `PEXT` era microcodificado ~18 ciclos).
[target.x86_64-pc-windows-gnu]
linker = "/opt/homebrew/bin/x86_64-w64-mingw32-gcc"
ar = "/opt/homebrew/bin/x86_64-w64-mingw32-ar"
rustflags = ["-C", "target-cpu=x86-64-v2"]

# --- Linux x86_64 nativo (para quien clone el repo y compile ahi) ---
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

# --- macOS x86_64 (Mac Intel y validacion bajo Rosetta 2) ---
[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v2"]

# --- Linux ARM64 nativo (ej. servidores ARM, Raspberry Pi 4/5 de 64 bits) ---
# Mismo caso que Android arriba: +dotprod es requisito duro del codigo
# fuente (src/neural.rs), no una optimizacion opcional. Sin esta bandera
# el build de este target directamente no compila.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+dotprod"]
