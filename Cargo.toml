[package]
name = "mi-motor-rust"
version = "0.8.0"
edition = "2024"
description = "Motor de ajedrez UCI de Tavito, version reparada"

[lib]
name = "mimotor_core"
crate-type = ["staticlib", "cdylib"]
path = "src/lib.rs"

[dependencies]
arrayvec = "0.7.8"
rand = "0.10.2"
shakmaty = "0.30.1"
shakmaty-syzygy = "0.28.1"

# Puente JNI para Android: solo se compila cuando el target es Android,
# asi las compilaciones de macOS/iOS no arrastran esta dependencia.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true



[profile.profiling]
inherits = "release"
strip = false
debug = 1
