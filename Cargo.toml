[package]
name = "mittens"
version = "0.8.0"
edition = "2024"
description = "Motor de ajedrez UCI de Tavito, version reparada"

[lib]
name = "mimotor_core"
crate-type = ["rlib", "staticlib", "cdylib"]
path = "src/lib.rs"

[features]
# Preset para torneos donde todas las tablas se valoran sin contempt.
tournament = []
# Perfil CCRL: nombre propio y Hash=256 MiB al arrancar.
ccrl = ["tournament"]
# Lookup PEXT para Intel con BMI2; otras arquitecturas conservan magic bitboards.
intel-bmi2 = []
# Salida SCReLU exacta con USDOT (FEAT_I8MM) en ARM64 cuando los pesos l1w caben en i8.
experimental-i8mm = []

[dependencies]
arrayvec = "0.7.8"
rand = "0.10.2"
shakmaty = "0.30.1"
shakmaty-syzygy = "0.28.1"

# Puente JNI para Android: solo se compila cuando el target es Android,
# asi las compilaciones de macOS/iOS no arrastran esta dependencia.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true



[profile.profiling]
inherits = "release"
strip = false
debug = 1
